<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
</head>

<body>
    <title>Calculadora</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator-card {
            max-width: 480px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, .175);
            background-color: #ffffff;
            overflow: hidden;
        }

        .calculator-screen {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 1.5rem;
            text-align: right;
            border-bottom: 2px solid #e2e8f0;
        }

        .calculator-screen .history {
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 1.2rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calculator-screen .current-output {
            font-size: 2.2rem;
            font-weight: 600;
            word-wrap: break-word;
            word-break: break-all;
        }

        .btn-calc {
            font-weight: 600;
            padding: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-calc:hover {
            transform: translateY(-2px);
        }

        .btn-operation {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
        }

        .btn-operation:hover {
            background-color: #cbd5e1;
            color: #0f172a;
        }

        .btn-scientific {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: none;
        }

        .btn-scientific:hover {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .btn-action {
            background-color: #fee2e2;
            color: #b91c1c;
            border: none;
        }

        .btn-action:hover {
            background-color: #fecaca;
            color: #991b1b;
        }

        .btn-equals {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
        }

        .btn-equals:hover {
            background-color: #1d4ed8;
            color: #ffffff;
        }
    </style>

</head>

<body>
    <div class="calculadora">

        <input type="text" id="pantalla" readonly>

        <br>

        <button onclick="pantalla.value+='7'">7</button>
        <button onclick="pantalla.value+='8'">8</button>
        <button onclick="pantalla.value+='9'">9</button>
        <button onclick="pantalla.value+='/'">÷</button>

        <br>

        <button onclick="pantalla.value+='4'">4</button>
        <button onclick="pantalla.value+='5'">5</button>
        <button onclick="pantalla.value+='6'">6</button>
        <button onclick="pantalla.value+='*'">×</button>

        <br>

        <button onclick="pantalla.value+='1'">1</button>
        <button onclick="pantalla.value+='2'">2</button>
        <button onclick="pantalla.value+='3'">3</button>
        <button onclick="pantalla.value+='-'">-</button>

        <br>

        <button onclick="pantalla.value+='0'">0</button>
        <button onclick="pantalla.value+='.'">.</button>
        <button onclick="pantalla.value+='+'">+</button>
        <button onclick="pantalla.value=eval(pantalla.value)">=</button>

        <br>

        <button onclick="pantalla.value=Math.sqrt(eval(pantalla.value))">√</button>
        <button onclick="pantalla.value=Math.pow(eval(pantalla.value),2)">x²</button>
        <button onclick="pantalla.value=Math.sin(eval(pantalla.value)*Math.PI/180)">sin</button>
        <button onclick="pantalla.value=Math.cos(eval(pantalla.value)*Math.PI/180)">cos</button>

        <br>

        <button onclick="pantalla.value=Math.tan(eval(pantalla.value)*Math.PI/180)">tan</button>
        <button onclick="pantalla.value=Math.log10(eval(pantalla.value))">log</button>
        <button onclick="pantalla.value=Math.log(eval(pantalla.value))">ln</button>
        <button onclick="pantalla.value=''">C</button>

    </div>


</body>

</html>
