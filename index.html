<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>

<body>

    <div class="container px-3">
        <div class="calculator-card mx-auto">
            <div class="calculator-screen">
                <div id="history" class="history"></div>
                <div id="display" class="current-output">0</div>
            </div>

            <div class="p-4 bg-white">
                <div class="row g-2">

                    <div class="col-3"><button class="btn btn-calc btn-action w-100"
                            onclick="clearDisplay()">AC</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-action w-100" onclick="deleteLast()"><i
                                class="fa-solid fa-delete-left"></i></button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendOperator('%')">%</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendOperator('/')">÷</button></div>

                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendScientific('Math.sin(')">sin</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendValue('7')">7</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendValue('8')">8</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendValue('9')">9</button></div>

                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendScientific('Math.cos(')">cos</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendValue('4')">4</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendValue('5')">5</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendValue('6')">6</button></div>

                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendScientific('Math.tan(')">tan</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendValue('1')">1</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendValue('2')">2</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendValue('3')">3</button></div>

                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendScientific('Math.log10(')">log</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendValue('0')">0</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendValue('.')">.</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendOperator('*')">×</button></div>

                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendScientific('Math.sqrt(')">√</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-scientific w-100"
                            onclick="appendOperator('**')">x^y</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendOperator('-')">-</button></div>
                    <div class="col-3"><button class="btn btn-calc btn-operation w-100"
                            onclick="appendOperator('+')">+</button></div>


                    <div class="col-12"><button class="btn btn-calc btn-equals w-100"
                            onclick="calculateResult()">=</button></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
